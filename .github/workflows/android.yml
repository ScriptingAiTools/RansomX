name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:    # bisa trigger manual dari HP

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          echo "y" | sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Setup OpenSSL for Android (prebuilt)
        run: |
          # Download prebuilt OpenSSL for Android NDK
          git clone https://github.com/217heidai/openssl_for_android.git
          cp -r openssl_for_android/openssl-1.1.1u/arm64-v8a \
            app/src/main/cpp/openssl/arm64-v8a
          cp -r openssl_for_android/openssl-1.1.1u/x86_64 \
            app/src/main/cpp/openssl/x86_64

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
